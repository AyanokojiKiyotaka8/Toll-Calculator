syntax = "proto3";

option go_package = "github.com/AyanokojiKiyotaka8/Toll-Calculator/types";

message Test {
  int32 someint = 1;
  int32 someint2 = 2;
}

message Resp { string id = 1; }

message Req { string num = 1; }

service App {
  rpc GetUser(stream Req) returns (stream Resp) {};
}

